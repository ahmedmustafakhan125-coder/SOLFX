[package]
name = "solfx-referral"
description = "SolFX introducing-broker ledger: immutable bindings, per-trade accrual, permissionless claims."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "solfx_referral"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "solfx-core/idl-build"]
custom-heap = []
custom-panic = []
anchor-debug = []

[lints]
workspace = true

[dependencies]
solfx-math.workspace = true
anchor-lang = { workspace = true, features = ["init-if-needed"] }
anchor-spl.workspace = true
# The financial core, as a library: this program reads its `UserAccount` (Anchor verifies
# the owner for us) and calls `pay_referral` by CPI. The dependency points **one way** —
# core has no idea this program exists beyond a pubkey it was told to trust.
solfx-core = { path = "../solfx-core", features = ["cpi"] }
