<script id="docs" type="application/json">[{"id": "README", "md": "# NOXFUNDS, in diagrams\n\nNOXFUNDS is a prop firm with no firm. A trader proves themselves in a simulated evaluation; an\ninvestor funds a trader they choose; the trader trades the investor's USDC on SolFX, under rules\nthe program checks **before** each trade fills. At the end the program divides the result\nbetween them. Nobody holds a key to the money while that happens. Not the trader, not the\ninvestor, not the admin.\n\nRead in this order. Each file is one question.\n\n| | File | The question it answers |\n|---|---|---|\n| 0 | [00-end-to-end.md](00-end-to-end.md) | What happens, start to finish, for both people? |\n| 1 | [01-what-is-different.md](01-what-is-different.md) | Why is this not just a prop firm on a blockchain? |\n| 2 | [02-who-holds-the-money.md](02-who-holds-the-money.md) | Where is the USDC at each moment, and who can move it? (escrow, vaults, accounts) |\n| 3 | [03-trader-evaluation.md](03-trader-evaluation.md) | How does a trader pass Phase 1 and 2 and get the verified tick? |\n| 4 | [04-investor-journey.md](04-investor-journey.md) | How does an investor find a trader, agree terms and fund them? |\n| 5 | [05-a-funded-trade.md](05-a-funded-trade.md) | What happens inside one trade on investor money? |\n| 6 | [06-settlement.md](06-settlement.md) | How does it end, and who gets paid what? |\n\nEvery name in a diagram (`accept_offer`, `[\"vault\", mandate]`, `Breached`) is the real\ninstruction, account seed or state in [`programs/noxfunds/`](../../../programs/noxfunds/src/).\nMarked **(new)**: built and tested, part of the upgrade in\n[NOXFUNDS-DEPLOY.md](../../NOXFUNDS-DEPLOY.md), **not yet on devnet**.\n\n## How to view them\n\n- **GitHub** draws them: open any file on github.com.\n- **VS Code**: install the *Markdown Preview Mermaid Support* extension\n  (`bierner.markdown-mermaid`), then open a file and press `Ctrl+Shift+V`.\n- **Any browser, all at once**: open [flowcharts.html](flowcharts.html). It needs an internet\n  connection the first time, for the Mermaid library.\n\n## Six words used everywhere\n\n| Word | Meaning here |\n|---|---|\n| **PDA** | An address the program derives from fixed words (\"seeds\"). It has **no private key**: only the program it belongs to can sign for it, and only by running its own code. |\n| **Vault** | A USDC token account whose owner is a PDA. NOXFUNDS' vaults are PDAs at fixed seeds, **not** ATAs, so nobody can substitute another account. |\n| **ATA** | A wallet's ordinary USDC account (Associated Token Account). The money starts in the investor's and ends in the investor's, trader's and treasury's. |\n| **CPI** | One program calling another inside the same transaction. NOXFUNDS calls SolFX this way, signing as a PDA. |\n| **Crank / keeper** | A public instruction anyone may call (and the bot that does), to mark prices, fire stops, fill orders or wind down. None of them can move money anywhere it was not already going. |\n| **Atomic** | A Solana transaction succeeds completely or not at all. A trade that breaks a rule is not punished afterwards: it never happens. |\n"}, {"id": "00-end-to-end", "md": "# 0 — Start to finish, both sides\n\nFive actors. The **investor** and **trader** are wallets. **NOXFUNDS** is the rules program and\nholds custody through PDAs. **SolFX** is the exchange it trades on, where the LP pool takes the\nother side of every trade. The **keeper** is a bot anyone could run; every instruction it calls\nis public.\n\n```mermaid\nsequenceDiagram\n    autonumber\n    actor T as Trader\n    actor I as Investor\n    participant N as NOXFUNDS program\n    participant S as SolFX exchange + LP pool\n    participant K as Keeper (anyone)\n\n    rect rgba(120,120,255,0.08)\n    Note over T,N: Part A - the trader earns a record (no investor money involved)\n    T->>N: initialize_trader_profile (one per wallet, starts Bronze)\n    T->>N: start_evaluation - 50 USDC stake into an escrow PDA\n    loop Phase 1 (target 8 pct), then Phase 2 (target 5 pct)\n        T->>N: eval_open_position / limit or stop entry (stop-loss mandatory)\n        N->>S: reads the SolFX market and Pyth price, priced by SolFX's own code (nothing traded)\n        K->>N: eval_trigger_stop / take-profit / fill entry / observe equity\n        T->>N: eval_close_position\n    end\n    T->>N: claim_stage_pass (Phase 2)\n    N-->>T: 50 USDC stake refunded, profile counts the pass\n    Note over N: TraderVerified event - verified tick in the marketplace\n    end\n\n    rect rgba(120,255,120,0.08)\n    Note over T,I: Part B - they find each other and agree\n    T->>N: post_listing (what the trader is looking for)\n    I->>N: post_offer - principal moves into offer escrow, rules fixed\n    alt trader declines\n        T->>N: decline_offer with a reason (no money moves)\n        I->>N: revoke_offer - escrow returns to the investor\n    else trader accepts\n        T->>N: accept_offer - mandate created, escrow moves to mandate vault (one transaction)\n    end\n    end\n\n    rect rgba(255,200,120,0.10)\n    Note over T,S: Part C - the trader trades the investor's money\n    T->>N: prepare - SOL for rent, create the SolFX account, move vault into SolFX collateral\n    N->>S: create_solfx_account and deposit_collateral, signed by the mandate PDA\n    T->>N: funded_open_position (rules checked first)\n    N->>S: open_position + stop-loss, in the same transaction\n    K->>N: observe_mandate_equity (breach check), reconcile_position (after a stop fires)\n    T->>N: funded_close_position\n    S-->>S: profit or loss settles against the LP pool, into the mandate's SolFX collateral\n    end\n\n    rect rgba(255,120,120,0.08)\n    Note over I,S: Part D - it ends and everyone is paid\n    I->>N: request_settlement (Active to WindingDown)\n    K->>N: wind_down_position (anyone, if positions are still open)\n    K->>N: claim_settlement (anyone)\n    N->>S: withdraw all collateral back to the mandate vault\n    N-->>I: principal + 30 pct of net profit (or everything left, on a loss)\n    N-->>T: 70 pct of net profit (0 on a loss)\n    N-->>N: 5 pct of gross profit to the treasury (0 on a loss)\n    end\n```\n\nThe same story in one line each:\n\n| Step | Who signs | What moves |\n|---|---|---|\n| Evaluation | trader | 50 USDC stake into escrow, back on a pass, to the treasury on a fail |\n| Offer | investor | the whole principal, investor's USDC account → offer escrow |\n| Accept | trader | escrow → mandate vault. Trader pays the account rent |\n| Prepare | anyone (the trader's page) | mandate vault → SolFX collateral |\n| Trade | trader | collateral ↔ position margin. P&L comes from or goes to the SolFX LP pool |\n| Settle | anyone | SolFX collateral → mandate vault → investor, trader, treasury |\n\nThe details of each part are in the numbered files that follow.\n"}, {"id": "01-what-is-different", "md": "# 1 — What makes it different\n\n## A normal prop firm checks the rules after the trade. NOXFUNDS checks them before.\n\n```mermaid\nflowchart TB\n    subgraph PF[\"A normal prop firm\"]\n        direction TB\n        p1[\"Trader sends an order\"] --> p2[\"Broker fills it\"]\n        p2 --> p3[\"Firm's risk desk looks at it later\"]\n        p3 --> p4{\"Rule broken?\"}\n        p4 -- yes --> p5[\"Account closed.<br/>The loss already happened\"]\n        p4 -- no --> p6[\"Trade stands\"]\n    end\n\n    subgraph NX[\"NOXFUNDS\"]\n        direction TB\n        n1[\"Trader sends an order to NOXFUNDS\"] --> n2{\"Every rule checked<br/>in the same transaction\"}\n        n2 -- \"any rule fails\" --> n3[\"Whole transaction reverts.<br/>No fill, no loss, nothing recorded\"]\n        n2 -- \"all pass\" --> n4[\"NOXFUNDS signs the order to SolFX<br/>with the stop-loss attached\"]\n        n4 --> n5[\"Filled\"]\n    end\n```\n\nThis works because a Solana transaction is all or nothing. \"Check the rule, then trade\" in one\ntransaction means a trade that fails the check **never existed**.\n\n## The pieces, and who controls what\n\n```mermaid\nflowchart LR\n    INV([\"Investor wallet\"])\n    TRD([\"Trader wallet\"])\n    ADM([\"Admin\"])\n    KPR([\"Keeper - anyone\"])\n\n    subgraph NOX[\"NOXFUNDS program\"]\n        RULES[\"Rules, fixed per mandate<br/>at funding, never editable\"]\n        PDA[\"Vaults and the mandate signer<br/>PDAs - no private key exists\"]\n        REC[\"TraderProfile<br/>one per wallet, every trade\"]\n    end\n\n    subgraph SFX[\"SolFX exchange - not modified by NOXFUNDS\"]\n        UA[\"The mandate's SolFX account<br/>authority = mandate signer PDA\"]\n        LP[\"LP pool<br/>the other side of every trade\"]\n        ORA[\"Pyth prices\"]\n    end\n\n    IDX[(\"Indexer<br/>re-derives every record<br/>from on-chain events\")]\n\n    INV -- \"funds and ends a mandate\" --> NOX\n    TRD -- \"trades, inside the rules\" --> NOX\n    KPR -- \"marks prices, fires stops,<br/>fills orders, winds down\" --> NOX\n    ADM -. \"can pause new activity and change the<br/>treasury address. Cannot move any funds\" .-> NOX\n    PDA -- \"CPI, signed by the PDA\" --> UA\n    UA <--> LP\n    ORA --> SFX\n    NOX -- \"events\" --> IDX\n```\n\n## The differences, one by one\n\n| | A normal prop firm | NOXFUNDS |\n|---|---|---|\n| When rules are enforced | after the fill, by a risk desk | **before** the fill, in the same transaction |\n| Stop-loss | \"please use one\" | an order **cannot be sent** without one; it is placed in the same transaction |\n| Who holds the capital | the firm's bank account | a vault owned by a PDA. No key exists for it |\n| Can the rules change mid-way? | yes, they are a PDF | no. Fields on the mandate, no instruction edits them |\n| Is the funded account real? | you cannot check | the vault and SolFX account are public; anyone can read the balance |\n| Track record | the firm's database | `TraderProfile`, one per wallet, every trade from every mandate, re-derivable from events |\n| If the trader disappears | the firm closes them out | **anyone** can wind down positions and settle; the investor is never stuck |\n| Who decides the payout | the firm | a formula in the program, run by whoever calls `claim_settlement` |\n| Evaluation fee | lost if you fail | 50 USDC **stake**, refunded in full when you pass |\n\n## Where trust is still required, stated plainly\n\n1. **The program can be upgraded.** Whoever holds the upgrade authority can replace the code.\n   Not yet handed to a multisig.\n2. **The admin can pause, and (new) change the treasury address** (where future fees and\n   forfeited stakes go). Pausing blocks new activity; it does not stop settlement. The admin\n   cannot move any funds.\n3. **No external audit has been done.** Tests prove what someone thought to test, nothing more.\n"}, {"id": "02-who-holds-the-money", "md": "# 2 — Who holds the money, at every moment\n\nThe investor's USDC passes through four places and comes out in up to three. At no point is it\nin an account that a person holds a key to. The vaults belong to PDAs, and PDAs have no key.\n\n## The path of the investor's USDC\n\n```mermaid\nflowchart TB\n    A[\"Investor's USDC account (ATA)<br/>owner: investor wallet\"]\n    B[\"Offer escrow<br/>PDA token account [offer_vault, offer]<br/>owner: the offer PDA\"]\n    C[\"Mandate vault<br/>PDA token account [vault, mandate]<br/>owner: the mandate signer PDA\"]\n    D[\"SolFX collateral vault (shared by all SolFX users)<br/>the mandate's share is free_collateral<br/>on SolFX UserAccount [user, mandate signer]\"]\n    E[\"Open position's margin<br/>still inside SolFX\"]\n    LP[(\"SolFX LP pool<br/>the counterparty\")]\n    F1[\"Investor's USDC account\"]\n    F2[\"Trader's USDC account\"]\n    F3[\"Treasury's USDC account\"]\n\n    A -- \"1. post_offer<br/>investor signs\" --> B\n    B -- \"1b. revoke_offer<br/>investor takes it back, any time before acceptance\" --> A\n    B -- \"2. accept_offer<br/>trader signs, same transaction creates the mandate\" --> C\n    A -. \"or fund_mandate<br/>investor and trader both sign\" .-> C\n    C -- \"3. fund_solfx_collateral<br/>anyone, CPI deposit_collateral signed by the PDA\" --> D\n    D -- \"4. funded_open_position\" --> E\n    E -- \"5. close, stop, take-profit, wind-down\" --> D\n    E <-- \"profit paid by the pool, loss paid to it\" --> LP\n    D -- \"6. claim_settlement withdraws everything\" --> C\n    C -- \"7a. principal + 30 pct of net profit\" --> F1\n    C -- \"7b. 70 pct of net profit\" --> F2\n    C -- \"7c. 5 pct of gross profit\" --> F3\n```\n\nSteps 1 to 3 are the escrow. Steps 4 and 5 are trading. Steps 6 and 7 are settlement, in **one**\ninstruction. Nothing pays out until every position is closed.\n\n## Who can move it out of each place\n\n| Place | Address (seeds) | Owner | The only ways out |\n|---|---|---|---|\n| Investor's USDC account | the wallet's ATA | investor | the investor's own signature |\n| Offer escrow | `[\"offer_vault\", offer]` | offer PDA | `accept_offer` → mandate vault (trader signs) · `revoke_offer` → back to the investor (investor signs) |\n| Mandate vault | `[\"vault\", mandate]` | mandate signer PDA `[\"signer\", mandate]` | `fund_solfx_collateral` → SolFX · `claim_settlement` → the three recorded payees |\n| SolFX collateral | the mandate's SolFX account `[\"user\", mandate signer]` | mandate signer PDA | trades (margin and P&L) · `claim_settlement` → the mandate vault. **There is no withdraw instruction for the trader.** |\n| Payouts | USDC accounts whose owner is the investor, trader and treasury **recorded on the mandate** | them | theirs |\n\nTwo consequences worth reading twice:\n\n- **Who gets paid is fixed when the mandate is created.** `claim_settlement` can be called by\n  anyone, but it only accepts payee accounts owned by the investor and trader written on the\n  mandate, and the configured treasury. A caller cannot send the money anywhere else.\n- **Accept is atomic.** The mandate, its vault and the transfer are one transaction. There is no\n  moment where terms are agreed and the money has not moved, or the money moved and there are\n  no terms.\n\n## Why a separate \"mandate signer\" PDA?\n\n```mermaid\nflowchart LR\n    M[\"Mandate account<br/>holds the rules and state<br/>(has data)\"]\n    S[\"Mandate signer PDA [signer, mandate]<br/>holds no data, a little SOL\"]\n    V[\"Mandate vault<br/>USDC\"]\n    U[\"SolFX UserAccount<br/>and every SolFX position\"]\n\n    M -- \"derives\" --> S\n    S -- \"owns\" --> V\n    S -- \"is the authority of\" --> U\n    S -- \"pays rent for SolFX<br/>positions and stop orders\" --> U\n```\n\nSolFX makes the account authority pay rent for new positions, through the System Program, and\nthe System Program refuses a payer that carries data. So the authority has to be a separate,\ndataless PDA. That is why the trader's page has a **prepare** step that tops it up with a little\nSOL. After settlement, `sweep_mandate_signer` **(new)** returns whatever SOL is left to the\ntrader.\n\n## The trader's evaluation stake\n\n```mermaid\nflowchart LR\n    T[\"Trader's USDC account\"]\n    EV[\"Stake escrow<br/>PDA token account [eval_vault, evaluation]<br/>owner: the evaluation PDA\"]\n    TR[\"Treasury's USDC account\"]\n\n    T -- \"start_evaluation<br/>50 USDC\" --> EV\n    EV -- \"claim_stage_pass, Phase 2<br/>refunded in full\" --> T\n    EV -- \"forfeit_stake, anyone<br/>after a fail or abandon\" --> TR\n```\n\nThe simulated balance ($10,000 to $200,000) is a number on the `Evaluation` account. No real\nmoney backs it and none moves when a simulated trade wins or loses. Only the stake is real.\n\n## Who pays rent (SOL), and gets it back\n\n| Account | Paid by | Returned |\n|---|---|---|\n| Offer and its escrow | investor | no, they stay as the public record of the negotiation |\n| Mandate and its vault | trader on `accept_offer` (investor on `fund_mandate`) | no, it is the permanent record |\n| SolFX positions | the mandate signer PDA (topped up by **prepare**) | to the signer when SolFX closes the position, swept to the trader after settlement |\n| Evaluation, stake escrow | trader | no, it is the record |\n| A simulated position | trader, or the keeper who fills an entry order | to the trader on close |\n| A resting entry order **(new)** | whoever places it | to the keeper that fills it, or to the trader on cancel |\n"}, {"id": "03-trader-evaluation", "md": "# 3 — The trader's evaluation: Phase 1, Phase 2, and the verified tick\n\nAn evaluation is how a trader builds a record **before** anyone risks money on them. The balance\nis simulated; only the 50 USDC stake is real. Each simulated trade is priced by SolFX's own code\non the live Pyth price, so a simulated fill and a real one agree to the last unit.\n\n## The whole journey\n\n```mermaid\nflowchart TB\n    start([\"Trader connects a wallet\"]) --> prof[\"initialize_trader_profile<br/>one per wallet, starts at Bronze\"]\n    prof --> se[\"start_evaluation<br/>choose a simulated size, 10,000 to 200,000<br/>50 USDC stake moves into escrow\"]\n    se --> p1[\"Phase 1<br/>target +8 pct\"]\n\n    p1 --> trade1[[\"Trade (see the next diagram)\"]]\n    trade1 --> chk1{\"Loss limit broken?<br/>more than 3 pct in a UTC day,<br/>or 6 pct below the peak\"}\n    chk1 -- yes --> fail[\"Failed\"]\n    chk1 -- no --> ready1{\"claim_stage_pass allowed?<br/>target reached, 10+ trades over 5+ days,<br/>average hold 45+ min, no day above half the target,<br/>nothing open, no resting orders\"}\n    ready1 -- \"not yet\" --> trade1\n    ready1 -- yes --> p2[\"Phase 2<br/>balance reset, target +5 pct\"]\n\n    p2 --> trade2[[\"Trade\"]]\n    trade2 --> chk2{\"Loss limit broken?\"}\n    chk2 -- yes --> fail\n    chk2 -- no --> ready2{\"claim_stage_pass allowed?<br/>same conditions, 5 pct target\"}\n    ready2 -- \"not yet\" --> trade2\n    ready2 -- yes --> pass[\"Passed<br/>stake refunded in full<br/>evaluations_passed + 1 on the profile<br/>TraderVerified event\"]\n    pass --> tick([\"Verified tick next to the trader<br/>in the marketplace\"])\n\n    p1 -. \"abandon_evaluation\" .-> fail\n    p2 -. \"abandon_evaluation\" .-> fail\n    fail --> forfeit[\"forfeit_stake, anyone can call it<br/>50 USDC to the treasury\"]\n```\n\nThere is no time limit. The loss limits are judged whenever a close leaves the account flat, and\nwhenever anyone calls `eval_observe_equity`, which marks every open position to the live price\n(the keeper does it every 5 minutes while positions are open). So refusing to close a losing\ntrade does not hide it.\n\n## One simulated trade, and the orders a trader can use\n\n```mermaid\nflowchart TB\n    subgraph IN[\"Getting in\"]\n        mk[\"Market order<br/>eval_open_position\"]\n        lim[\"Limit entry (new)<br/>eval_place_entry_order<br/>fills at the limit or better\"]\n        stp[\"Stop entry (new)<br/>fills once the price breaks through\"]\n    end\n\n    rules{\"Every open is checked:<br/>stop-loss present, on the right side,<br/>risk at the stop at most 1 pct of balance,<br/>at most 5 open, market open, prices fresh\"}\n    mk --> rules\n    lim -- \"keeper calls eval_fill_entry_order<br/>when the price reaches it\" --> rules\n    stp -- \"same\" --> rules\n    rules -- fails --> refused[\"Refused - nothing opens.<br/>A resting order keeps waiting or expires\"]\n    rules -- passes --> pos[\"VirtualPosition<br/>entry, size, stop, optional take-profit\"]\n\n    subgraph MANAGE[\"While it is open\"]\n        tp[\"Set or move a take-profit (new)\"]\n        ms[\"Tighten the stop (new)<br/>only toward the price, only after 10 min\"]\n    end\n    pos --- MANAGE\n\n    subgraph OUT[\"Getting out\"]\n        cl[\"Close yourself<br/>allowed after 10 min\"]\n        sl[\"Stop-loss hit<br/>keeper: eval_trigger_stop<br/>exempt from the hold rules\"]\n        tpf[\"Take-profit hit (new)<br/>keeper: eval_trigger_take_profit<br/>after 10 min, counts as a normal close\"]\n    end\n    pos --> cl\n    pos --> sl\n    pos --> tpf\n    cl --> booked[\"P and L added to the simulated balance,<br/>trade counted on the record\"]\n    sl --> booked\n    tpf --> booked\n```\n\nWhy the stop can only be tightened, and only after 10 minutes: a stop-out is exempt from the\nhold rules, because a stop is the discipline the rules ask for. If a trader could drag the stop\nup to the price in minute one, that exemption would be a way to scalp. Same reason a take-profit\nonly fires after the 10-minute hold.\n\n## What the verified tick means, and where it comes from\n\n```mermaid\nflowchart LR\n    cs[\"claim_stage_pass, Phase 2\"] --> ev[\"Evaluation state = Passed\"]\n    cs --> pr[\"TraderProfile.evaluations_passed + 1<br/>last_passed_at = now (new)\"]\n    cs --> e[\"TraderVerified event (new)\"]\n    ev --> mk[\"Marketplace shows the tick\"]\n    pr --> mk\n    e --> ix[(\"Indexer\")] --> mk\n```\n\nThe tick is computed from the chain, not typed in by anyone: an evaluation account in state\n`Passed`, or the counter on the trader's profile. The indexer re-derives the same thing from\nevents, and `/nox/verify` lets anyone check that the two agree.\n"}, {"id": "04-investor-journey", "md": "# 4 — The investor's journey: finding a trader, agreeing, funding\n\nThere is no chat. Every \"message\" is a typed on-chain object tied to a real step, carrying a short\nnote (180 bytes at most). The investor's offer **is** the contract: the money is already in\nescrow and the rules are already fixed in it. The trader's acceptance is the signature.\n\n## Finding each other\n\n```mermaid\nflowchart TB\n    subgraph DISC[\"Discovery - /nox/market\"]\n        tl[\"Trader listing<br/>post_listing - what they are looking for\"]\n        il[\"Investor listing<br/>post_investor_listing - what they offer\"]\n        rec[\"Each trader's record:<br/>tier, profit factor, drawdown, trades,<br/>verified tick, all from the chain\"]\n    end\n\n    inv([\"Investor\"]) --> rec\n    rec --> choose{\"Who starts?\"}\n    choose -- \"investor\" --> off[\"post_offer<br/>principal into escrow + the full rule set + expiry + note\"]\n    choose -- \"trader, only to an investor<br/>with an open listing\" --> req[\"post_request<br/>a note, one open request per pair\"]\n    req --> ans{\"Investor answers\"}\n    ans -- \"with an offer\" --> off\n    ans -- \"dismisses\" --> rclosed[\"close_request<br/>trader's rent returned\"]\n\n    off --> tr{\"Trader decides\"}\n    tr -- \"accept_offer\" --> mandate[\"Mandate created, Active<br/>escrow moved into the mandate vault<br/>rules copied byte for byte from the offer\"]\n    tr -- \"decline_offer, with a reason\" --> dec[\"Declined - money still in escrow\"]\n    dec --> rev[\"revoke_offer<br/>escrow back to the investor\"]\n    dec -. \"investor revises\" .-> off\n    off -- \"investor changes their mind,<br/>or it expires\" --> rev\n```\n\nWhat this guarantees:\n\n- **The investor can always take the money back until a trader signs.** Declining never moves\n  money, and an expired offer cannot be accepted.\n- **A request can only reach an investor who has listed**, and only one per trader–investor\n  pair. No wallet can be spammed for merely existing.\n- **The rules the trader accepts are exactly the rules the investor published.** The program\n  copies them from the offer; nobody retypes them.\n- A trader can only accept up to their tier's limits: Bronze $10,000 and one mandate at a\n  time, up to Platinum $200,000 and five.\n\n## What the investor sets, and can never change afterwards\n\n| Rule on the mandate | What it stops |\n|---|---|\n| `max_trade_notional` | one oversized bet |\n| `max_total_notional` | many bets adding up to one |\n| `max_concurrent_positions` | too many open at once |\n| `max_risk_per_trade_bps` | a stop so far away it is not a stop (risk measured at the stop, before the fill) |\n| `max_stop_distance_bps` | the same, measured in price |\n| `max_drawdown_bps`, `max_daily_loss_bps` | trading on after the capital is impaired |\n| `allowed_markets` | instruments outside the agreement |\n| `min_hold_slots` | scalping (stop-outs exempt) |\n| `trader_split_bps` | the trader's share of net profit (70 pct by default) |\n\nThere is no instruction that edits any of these. Different rules mean a different mandate.\n\n## After acceptance: prepare, trade, watch, end\n\n```mermaid\nflowchart TB\n    acc[\"Mandate Active<br/>USDC in the mandate vault\"] --> prep[\"Prepare - one click on the trader's page, anyone may send it<br/>1. a little SOL to the mandate signer, for SolFX rent<br/>2. create_solfx_account<br/>3. fund_solfx_collateral - vault into SolFX\"]\n    prep --> trading[\"Trader trades - see 05-a-funded-trade.md\"]\n    trading --> watch{\"Keeper or anyone:<br/>observe_mandate_equity\"}\n    watch -- \"drawdown or daily-loss limit crossed\" --> br[\"Breached<br/>no new trades\"]\n    watch -- \"fine\" --> trading\n    trading --> rs[\"Investor: request_settlement<br/>Active to WindingDown, no new trades\"]\n    br --> wd[\"Positions still open?<br/>wind_down_position - anyone may close them\"]\n    rs --> wd\n    wd --> cs[\"claim_settlement - anyone<br/>see 06-settlement.md\"]\n    cs --> done([\"Settled\"])\n```\n\nThe investor never depends on the trader to get the money back. A breached or winding-down\nmandate can be closed out and settled by anyone, with neither the trader nor any operator\ncooperating.\n\n## The two state machines\n\n```mermaid\nstateDiagram-v2\n    direction LR\n    state \"Offer\" as O {\n        [*] --> Open: post_offer\n        Open --> Accepted: accept_offer\n        Open --> Declined: decline_offer\n        Open --> Revoked: revoke_offer\n        Declined --> Revoked: revoke_offer\n        Accepted --> [*]\n        Revoked --> [*]\n    }\n```\n\n```mermaid\nstateDiagram-v2\n    direction LR\n    [*] --> Active: accept_offer or fund_mandate\n    Active --> Breached: observe_mandate_equity finds a limit crossed\n    Active --> WindingDown: request_settlement (investor)\n    Breached --> Settled: claim_settlement, once flat\n    WindingDown --> Settled: claim_settlement, once flat\n    Settled --> [*]\n```\n\n`Breached` does not pass through `WindingDown`. That keeps the record of **why** the mandate\nended, which is what the next investor reading this trader's history needs to see.\n"}, {"id": "05-a-funded-trade", "md": "# 5 — One trade on investor money\n\nThe trader never talks to the exchange. They sign a transaction **to NOXFUNDS**; NOXFUNDS checks\nevery rule and only then signs to SolFX, as the mandate's PDA. The trader's signature never\nreaches SolFX, so there is no way round the checks.\n\n## Opening: rules, position and stop-loss in one transaction\n\n```mermaid\nsequenceDiagram\n    autonumber\n    actor T as Trader\n    participant N as NOXFUNDS\n    participant S as SolFX\n    participant P as Pyth price\n\n    T->>N: funded_open_position(market, direction, size, margin, price limit, stop)\n    Note over N: Checks, in order<br/>signer is this mandate's trader<br/>protocol not paused, mandate Active<br/>market in allowed_markets<br/>trade notional and total notional under the caps<br/>open positions under the limit<br/>stop present, right side, within max distance<br/>risk at the stop within max_risk_per_trade_bps\n    alt any check fails\n        N--xT: transaction reverts - nothing filled, nothing recorded, nothing lost\n    else all pass\n        N->>S: CPI open_position, signed by the mandate signer PDA\n        S->>P: read the price (staleness and confidence gates)\n        S-->>N: position opened, margin taken from the mandate's free collateral\n        N->>S: CPI place_trigger_order - the stop-loss\n        S-->>N: stop resting on SolFX\n        N-->>T: done - position and stop exist together, or neither does\n    end\n```\n\nRisk per trade is the rule a normal prop firm **cannot** enforce: it can only measure your risk\nonce you already hold the position. Here the stop is part of the same transaction, so the\nprogram knows the worst case before anything fills.\n\n## While it is open, and how it can end\n\n```mermaid\nflowchart TB\n    pos([\"Funded position open on SolFX\"])\n\n    subgraph TRADER[\"What the trader can do\"]\n        tp[\"Place a take-profit<br/>funded_place_take_profit, after the min hold\"]\n        mv[\"Move the stop (new)<br/>funded_move_stop - new stop placed, then the old one cancelled\"]\n        red[\"Close part of it (new)<br/>funded_reduce_position\"]\n        mar[\"Add or remove margin (new)<br/>funded_add_margin / funded_remove_margin\"]\n        cl[\"Close it<br/>funded_close_position, after the min hold\"]\n    end\n\n    subgraph ANYONE[\"What happens without the trader\"]\n        sl[\"SolFX's keeper fires the stop or take-profit\"]\n        liq[\"SolFX liquidation, if margin runs out\"]\n        obs[\"observe_mandate_equity<br/>marks equity to the price, may Breach\"]\n        wd[\"wind_down_position<br/>only once Breached or WindingDown\"]\n    end\n\n    pos --- TRADER\n    pos --- ANYONE\n    sl --> rec[\"reconcile_position<br/>the keeper records a close that<br/>happened outside NOXFUNDS\"]\n    liq --> rec\n    cl --> book\n    rec --> book\n    wd --> book\n    red -- \"gross P and L only, the trade counts once when fully closed\" --> book\n    book[\"Recorded on the mandate and on the TraderProfile:<br/>realized P and L, win or loss, hold time\"]\n```\n\nWhat the trader **cannot** do, because no instruction exists for it: withdraw, change a rule,\nchange who gets paid, or trade a market the mandate does not allow.\n\n## Resting entry orders on a mandate (new)\n\n```mermaid\nsequenceDiagram\n    actor T as Trader\n    participant N as NOXFUNDS\n    participant K as Keeper (anyone)\n    participant S as SolFX\n\n    T->>N: funded_place_entry_order (limit or stop entry, size, stop-loss, optional take-profit, expiry)\n    Note over N: stored as MandateEntryOrder [morder, mandate, id]<br/>nothing traded yet\n    loop every keeper pass\n        K->>N: is the trigger reached? funded_fill_entry_order\n        Note over N: every open rule checked again, at the fill price<br/>a limit never fills worse than its limit\n        alt rules pass\n            N->>S: open_position + stop-loss, signed by the PDA\n        else rules fail or not reached\n            N--xK: refused - the order keeps waiting\n        end\n    end\n    T->>N: funded_cancel_entry_order (any time, or anyone once expired or the mandate ended)\n```\n\nAn order is a request, not a reservation. If the mandate's equity, open positions or caps have\nchanged by the time the price arrives, the fill is refused for exactly the reasons a market order\nwould be.\n"}, {"id": "06-settlement", "md": "# 6 — How it ends, and who gets paid what\n\nSettlement is one instruction, `claim_settlement`, that **anyone** can call. It takes no\nprivileged signer, so the investor never waits on the trader or on an operator.\n\n## What `claim_settlement` does\n\n```mermaid\nflowchart TB\n    start([\"Anyone calls claim_settlement\"]) --> st{\"Mandate is WindingDown or Breached?\"}\n    st -- no --> r1[\"Refused: MandateNotSettleable\"]\n    st -- yes --> op{\"Any position still open?\"}\n    op -- yes --> r2[\"Refused: PositionsStillOpen<br/>close them first - wind_down_position, anyone\"]\n    op -- no --> wd[\"Withdraw ALL free collateral from SolFX<br/>into the mandate vault (CPI, PDA-signed)\"]\n    wd --> fe[\"final equity = the mandate vault's real balance,<br/>read after the withdrawal\"]\n    fe --> pr{\"final equity above principal?\"}\n    pr -- \"no - a loss or flat\" --> loss[\"investor gets everything left<br/>trader 0, protocol 0\"]\n    pr -- \"yes - a profit\" --> g[\"gross = final equity - principal\"]\n    g --> fee[\"protocol = 5 pct of gross, rounded UP\"]\n    fee --> net[\"net = gross - protocol\"]\n    net --> trd[\"trader = 70 pct of net, rounded DOWN\"]\n    trd --> invs[\"investor = final equity - protocol - trader<br/>(the remainder, so the parts always add up exactly)\"]\n    loss --> pay\n    invs --> pay[\"Pay from the mandate vault, signed by the PDA,<br/>only to accounts owned by the recorded investor,<br/>the recorded trader and the configured treasury\"]\n    pay --> prof[\"TraderProfile: active mandates - 1<br/>settled in profit + 1 if the trades made money\"]\n    prof --> done([\"Settled - MandateSettled event\"])\n    done -.-> sw[\"sweep_mandate_signer (new)<br/>leftover SOL rent to the trader\"]\n```\n\nThe 5 pct and 70 pct are the defaults (`DEFAULT_PROTOCOL_FEE_BPS = 500`,\n`DEFAULT_TRADER_SPLIT_BPS = 7000`). The trader's share is fixed per mandate by the offer; the\nfee comes from the protocol config.\n\n## Two worked examples\n\n**A profit.** Principal $3,500, final equity $4,500:\n\n```\ngross profit                        $1,000\n− protocol fee, 5% of gross         $   50   → treasury\n─────────────────────────────────────────\nnet                                 $  950\n  → trader, 70% of net              $  665   → trader\n  → investor, principal + the rest  $3,785   → investor\n                                    ──────\n                                    $4,500   adds up exactly, by construction\n```\n\n**A loss — as it actually ran on devnet**, mandate `Bf7aVemJQwTq5trPgqo6t7vjmHy4M3FcxjjHSp1BCyrc`:\n\n```\ninvestor funds            200.000000 USDC\ntrader opens BTC/USD long, $100 notional, stop 100 bps below entry\ntrade loses; investor requests settlement; anyone settles\ninvestor receives         199.797874 USDC\ntrader receives             0\nprotocol receives           0\n```\n\nThe protocol never earns from a losing mandate, and the trader is never charged for one. The\ninvestor bears the trading loss; that is what putting up the capital means.\n\n## Rounding, and why it goes this way\n\n| Share | Rounds | Why |\n|---|---|---|\n| Protocol fee | up | a charge rounds toward whoever charges it |\n| Trader | down | a payout rounds down |\n| Investor | the remainder | the dust goes to the party whose capital was at risk, and the three always sum to the vault balance |\n\n\"In profit\" on the trader's record is judged on the **trades** (`realized_pnl`), not on the vault\nbalance, because anyone can send USDC to a vault. A trader topping up a losing mandate by a\ndollar cannot make it count toward Platinum.\n"}]</script>
<script src="https://cdn.jsdelivr.net/npm/marked@15.0.12/marked.min.js"></script>
<script type="module">
  import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11.17.2/dist/mermaid.esm.min.mjs";
  const docs = JSON.parse(document.getElementById("docs").textContent);
  const dark = matchMedia("(prefers-color-scheme: dark)").matches;
  const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  marked.use({
    renderer: {
      code({ text, lang }) {
        return lang === "mermaid"
          ? `<pre class="mermaid">${esc(text)}</pre>`
          : `<pre><code>${esc(text)}</code></pre>`;
      },
      link({ href, tokens }) {
        const inner = this.parser.parseInline(tokens);
        const local = /^(README|\d\d-[\w-]+)\.md$/.exec(href);
        return `<a href="${local ? "#" + local[1] : href}">${inner}</a>`;
      },
    },
  });
  document.getElementById("main").innerHTML = docs
    .map((d) => `<section id="${d.id}">${marked.parse(d.md)}</section>`)
    .join("");
  document.getElementById("nav").innerHTML = docs
    .map((d) => `<a href="#${d.id}">${d.id === "README" ? "Overview" : d.id}</a>`)
    .join("");
  mermaid.initialize({ startOnLoad: false, theme: dark ? "dark" : "default", securityLevel: "strict" });
  await mermaid.run({ querySelector: "pre.mermaid" });
</script>
